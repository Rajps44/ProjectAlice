---
################################################
#                                              #
#    Project Alice quick installation file     #
#           For advanced users only            #
# Edit the content of  this file to your needs #
# and   place   it in  /boot/ProjectAlice.yaml #
# after   flashing  your  sd  card   with  our #
# Project Alice image.                         #
#                                              #
# Upon  first  boot  Alice  will perform  some #
# updates and configure according to this file #
#                                              #
################################################
#            DON'T CHANGE ME                   #
version: 1.27
installSound: yes
################################################

# If you place this file into /boot after a first initialization it won't overwrite your settings unless you set this to yes
forceRewrite: yes

# After initialization is done, keep a copy of this yaml file in /boot.
keepYAMLBackup: no

# Base configs
adminPinCode: 1234

# Connection
mqttHost: localhost
mqttPort: 1883

# Hardware
audioHardware:
    usbMic:              yes
    respeaker2Mics:      no
    respeaker4MicArray:  no
    respeaker4MicLinear: no
    respeaker6MicArray:  no
    respeaker7MicArray:  no
    respeakerCoreV2:     no
    googleAIY:           no
    googleAIY2:          no
    matrixCreator:       no
    matrixVoice:         no
    ps3eye:              no
    jabra410:            no

# System
useHLC: yes
keepASROffline: yes
keepTTSOffline: yes
skillAutoUpdate: yes
webInterfaceActive: yes
devMode: yes

# Project Alice Settings
activeLanguage: en
activeCountryCode: US
baseCurrency: INR
baseUnits: metric
timezone: Asia/Kolkata

# NLU Configuration (ZOYA MOD)
# Options: 'snips' or 'ollama'
nluEngine: 'ollama'

# Confidence Threshold
probabilityThreshold: 0.5

# ASR & TTS
asr: 'coqui'
tts: pico
ttsLanguage: en-US

# GitHub (Optional but recommended)
githubUsername: 
githubToken: 

aliceUpdateChannel: master
skillsUpdateChannel: master

googleServiceFile: {}
